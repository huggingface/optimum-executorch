name: Build PR Documentation

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  build_documentation:
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    env:
      COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.number }}
      EVENT_CONTEXT: ${{ toJSON(github.event) }}
      PR_CLONE_URL: ${{ github.event.pull_request.head.repo.clone_url }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache-dependency-path: "kit/package-lock.json"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Setup environment
        run: |
          pip install --upgrade pip
          pip install uv
          pip install git+https://github.com/huggingface/doc-builder
          pip install . --no-deps
          doc-builder light-install optimum.executorch

      - name: Make documentation
        shell: bash
        run: |
          doc-builder build optimum.executorch docs/source/ \
            --repo_name optimum-executorch \
            --build_dir executorch-doc-build/ \
            --version pr_${{ github.event.number }} \
            --version_tag_suffix "" \
            --html \
            --clean \

      - name: Save commit_sha & pr_number
        run: |
          sudo chmod -R ugo+rwx executorch-doc-build
          cd executorch-doc-build
          sudo mv optimum.executorch optimum-executorch
          echo ${COMMIT_SHA} > ./commit_sha
          echo ${{ github.event.number }} > ./pr_number

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: doc-build-artifact
          path: executorch-doc-build/
