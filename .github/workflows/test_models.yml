name: ExecuTorch E2E / Python - Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  discover-tests:
    runs-on: ubuntu-22.04
    outputs:
      model_names: ${{ steps.set-matrix.outputs.model_names }}
    steps:
      - uses: actions/checkout@v3
      - name: Find model tests
        id: set-matrix
        run: |
          # Find all test files and extract model names correctly
          MODEL_NAMES=$(find tests/models -name "test_modeling_*.py" -type f | sed 's|tests/models/test_modeling_||' | sed 's|\.py$||' | paste -sd "," -)
          echo "model_names=[\"${MODEL_NAMES//,/\",\"}\"]" >> $GITHUB_OUTPUT

          # Display all discovered models
          echo "Discovered models:"
          echo "$MODEL_NAMES" | tr ',' '\n' | sort | awk '{print "- " $0}'

  run-tests:
    needs: discover-tests
    strategy:
      fail-fast: false
      matrix:
        test-modeling: ${{ fromJson(needs.discover-tests.outputs.model_names) }}
        executorch-version: ['1.3.1']
        python-version: ['3.11']
        # os: [macos-15, ubuntu-22.04]  # TODO(#122): Re-enable the mac tests after fixing seg fault.
        os: [ubuntu-22.04]

    # Custom job name, now shortened and cleaner
    name: ${{ matrix.test-modeling }} (et=${{ matrix.executorch-version }}, py=${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Fail cleanly on a hang instead of dragging the run for hours; large-model
    # export can be slow (especially once paging to swap), so keep this generous.
    timeout-minutes: 180
    env:
      MODEL_NAME: ${{ matrix.test-modeling }}
    steps:
      - uses: actions/checkout@v2
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Increase swap space
        run: |
          # Large models (e.g. gemma-3-4b, Phi-4-mini) push past the 16GB RAM on
          # standard runners and get OOM-killed during load/quantization
          # (exit 143). A big swapfile lets them page to disk instead of being killed.
          # Prefer /mnt (local scratch disk); fall back to the root FS if /mnt is
          # too small. Free space on both varies across the runner pool, so print
          # df before and after for debugging.
          echo "Memory + disk before:"
          free -h
          df -h / /mnt || true
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile || true
          if sudo fallocate -l 24G /mnt/swapfile; then
            SWAP_FILE=/mnt/swapfile
          else
            echo "fallocate on /mnt failed (insufficient space?); falling back to root FS."
            sudo rm -f /mnt/swapfile || true
            SWAP_FILE=/swapfile
            sudo fallocate -l 24G "$SWAP_FILE" || sudo dd if=/dev/zero of="$SWAP_FILE" bs=1M count=24576
          fi
          sudo chmod 600 "$SWAP_FILE"
          sudo mkswap "$SWAP_FILE"
          sudo swapon "$SWAP_FILE"
          echo "Memory + disk after (swap at ${SWAP_FILE}):"
          free -h
          df -h / /mnt || true
      - name: Install dependencies for ExecuTorch
        run: |
          # Clean up cache to save space
          pip cache purge || true
          rm -rf ~/.cache/huggingface/hub/* || true

          python install_dev.py --dependency_stack stable
          pip list
      - name: Run tests
        run: |
          RUN_SLOW=1 pytest tests/models/test_modeling_${{ matrix.test-modeling }}.py -s -vvvv --durations=0 --log-cli-level=INFO
