name: ExecuTorch E2E / Python - Nightly Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  discover-tests:
    runs-on: ubuntu-22.04
    outputs:
      model_names: ${{ steps.set-matrix.outputs.model_names }}
    steps:
      - uses: actions/checkout@v3
      - name: Find model tests
        id: set-matrix
        run: |
          MODEL_NAMES=$(find tests/models -name "test_modeling_*.py" -type f | sed 's|tests/models/test_modeling_||' | sed 's|\.py$||' | paste -sd "," -)
          echo "model_names=[\"${MODEL_NAMES//,/\",\"}\"]" >> $GITHUB_OUTPUT

          echo "Discovered models:"
          echo "$MODEL_NAMES" | tr ',' '\n' | sort | awk '{print "- " $0}'

  run-tests:
    needs: discover-tests
    strategy:
      fail-fast: false
      matrix:
        test-modeling: ${{ fromJson(needs.discover-tests.outputs.model_names) }}
        python-version: ['3.11']
        os: [ubuntu-22.04]

    name: ${{ matrix.test-modeling }} (et=nightly, py=${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Fail cleanly on a hang instead of dragging the run for hours; large-model
    # export can be slow (especially once paging to swap), so keep this generous.
    timeout-minutes: 180
    env:
      MODEL_NAME: ${{ matrix.test-modeling }}
    steps:
      - uses: actions/checkout@v2
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Free disk and increase swap space
        run: |
          # Large models (e.g. gemma-3-4b, Phi-4-mini) push past the 16GB RAM on
          # standard runners and get OOM-killed during load/quantization (exit 143);
          # a swapfile lets them page to disk. Runner disks vary widely (root seen
          # from ~15GB to ~87GB free; /mnt is not always a separate disk), so:
          #   1. reclaim space from unused preinstalled toolchains -- but NOT the
          #      Python tool-cache ($AGENT_TOOLSDIRECTORY), which setup-python needs;
          #   2. size the swapfile from the free space that remains, leaving headroom
          #      for downloaded model weights.
          # df/free are printed before and after for future debugging.
          echo "Before:"; free -h; df -h /
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile || true
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          AVAIL_GB="$(df -BG --output=avail / | tail -1 | tr -dc '0-9')"
          if [ -z "$AVAIL_GB" ]; then AVAIL_GB=0; fi
          RESERVE_GB=12   # leave room for model weights + exported artifacts
          SWAP_GB=$(( AVAIL_GB - RESERVE_GB ))
          if [ "$SWAP_GB" -gt 24 ]; then SWAP_GB=24; fi
          echo "Root avail=${AVAIL_GB}G -> swap=${SWAP_GB}G (reserve ${RESERVE_GB}G)"
          if [ "$SWAP_GB" -ge 2 ]; then
            sudo fallocate -l "${SWAP_GB}G" /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=$(( SWAP_GB * 1024 ))
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          else
            echo "::warning::Not enough free disk for a useful swapfile (avail=${AVAIL_GB}G); continuing without extra swap."
          fi
          echo "After:"; free -h; df -h /
      - name: Install dependencies for ExecuTorch nightly
        run: |
          pip cache purge || true
          rm -rf ~/.cache/huggingface/hub/* || true

          python install_dev.py --dependency_stack nightly
          pip list
      - name: Check ExecuTorch nightly import
        id: check-executorch
        run: |
          python - <<'PY'
          import os
          import sys

          try:
              from executorch.extension.pybindings.portable_lib import ExecuTorchModule
          except Exception as error:
              print(
                  "::warning::ExecuTorch nightly portable_lib import failed; "
                  f"skipping nightly model tests because the published nightly wheels are unusable: {error}"
              )
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write("available=false\n")
              sys.exit(0)

          print(f"ExecuTorch nightly portable_lib import succeeded: {ExecuTorchModule}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("available=true\n")
          PY
      - name: Run tests
        if: steps.check-executorch.outputs.available == 'true'
        run: |
          RUN_SLOW=1 pytest tests/models/test_modeling_${{ matrix.test-modeling }}.py -s -vvvv --durations=0 --log-cli-level=INFO
