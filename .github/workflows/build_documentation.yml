name: Build documentation

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions: {}

jobs:
  build_documentation:
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    env:
      PR_NUMBER: ${{ github.event.number }}
      EVENT_CONTEXT: ${{ toJSON(github.event) }}
      PR_CLONE_URL: ${{ github.event.pull_request.head.repo.clone_url }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache-dependency-path: "kit/package-lock.json"
      
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Set environment variables
        run: |
          cd optimum
          version=`echo "$(grep '^__version__ =' executorch/version.py | cut -d '=' -f 2- | xargs)"`

          if [[ $version == *.dev0 ]]
          then
            echo "VERSION=main" >> $GITHUB_ENV
          else
            echo "VERSION=v$version" >> $GITHUB_ENV
          fi

          cd ..

      - name: Setup environment
        run: |
          python -m pip install --upgrade pip
          python -m ensurepip --upgrade
          python -m pip install --upgrade setuptools
          python -m pip install uv
          python -m pip install git+https://github.com/huggingface/doc-builder
          python -m pip install . --no-deps
          doc-builder light-install optimum.executorch

      - name: Make documentation
        shell: bash
        run: |
          doc-builder build optimum.executorch docs/source/ \
            --repo_name optimum-executorch \
            --build_dir executorch-doc-build/ \
            --version ${VERSION} \
            --version_tag_suffix "" \
            --html \
            --clean \

      - name: Push documentation
        env:
          COMMIT_SHA: ${{ github.sha }}
          HF_TOKEN: ${{ secrets.HF_DOC_BUILD_PUSH }}
        run: |
          sudo chmod -R ugo+rwx executorch-doc-build
          cd executorch-doc-build
          sudo mv optimum.executorch optimum-executorch
          doc-builder push optimum-executorch --doc_build_repo_id "hf-doc-build/doc-build" --token "$HF_TOKEN" --commit_msg "Updated with commit $COMMIT_SHA See: https://github.com/huggingface/optimum-executorch/commit/$COMMIT_SHA" --n_retries 5
